<title>Mail เดโม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: Mail's own shell — pink brand block + side menu on the left, page column on the right, bell top-right, job pill bottom-right */
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#1f1d2b; --ink-2:#55536a; --muted:#8a889a; --line:#e7e9f0; --soft:#f1f2f7;
  --pink:#ff6fae; --accent:#e8458b; --accent-soft:#fde9f2; --accent-ink:#b8326f; --on-accent:#ffffff; --brand-ink:#141018;
  --ok:#1f9d63; --ok-soft:#e3f6ec; --warn:#c77a12; --warn-soft:#fff4e0; --bad:#d63a4a; --bad-soft:#fdecee; --info:#3b78d8;
  --yt:#ff4e45; --tt:#1fb8c0; --fb:#3b78d8; --ig:#d9529f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s5:#e87ba4;
  --f-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif; --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --panel:#1d1a23; --ink:#f1eef6; --ink-2:#c3bfd0; --muted:#8f8a9e; --line:#2e2a37; --soft:#26222e;
  --accent:#ff6fae; --accent-soft:#3a1d2c; --accent-ink:#ff9cc6; --on-accent:#1a0d14;
  --ok:#3ccf8e; --ok-soft:#173326; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#ff6b78; --bad-soft:#3a1a20; --info:#6aa5ff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s5:#d55181; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --panel:#1d1a23; --ink:#f1eef6; --ink-2:#c3bfd0; --muted:#8f8a9e; --line:#2e2a37; --soft:#26222e;
  --accent:#ff6fae; --accent-soft:#3a1d2c; --accent-ink:#ff9cc6; --on-accent:#1a0d14;
  --ok:#3ccf8e; --ok-soft:#173326; --warn:#f2b45a; --warn-soft:#3a2a12; --bad:#ff6b78; --bad-soft:#3a1a20; --info:#6aa5ff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s5:#d55181; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
/* side menu */
nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{background:var(--pink);padding:18px 16px;display:flex;gap:12px;align-items:center;color:var(--brand-ink)}
.logo{width:44px;height:44px;border:3px solid var(--brand-ink);border-radius:10px;display:grid;place-items:center;font-family:"Arial Black",var(--f-display);font-size:22px;font-weight:900;flex:none}
.brand b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.brand small{font-size:11.5px;color:#fff;opacity:.92}
.nsec{padding:14px 18px 4px;font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--muted)}
nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:1px 8px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:500}
nav a:hover{background:var(--soft)} nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav a svg{width:19px;height:19px;flex:none}
.nb{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11.5px;font-weight:700;min-width:20px;text-align:center;padding:0 7px;line-height:19px}
.nb.dot{background:var(--warn)}
.navfoot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted)}
/* page */
main{min-width:0;padding-block:24px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--ink-2)}
.demo{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin-top:6px}
.bell{margin-left:auto;position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);display:grid;place-items:center;flex:none}
.bell svg{width:21px;height:21px}.bell .n{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;line-height:19px;padding:0 5px}
.bpanel{position:absolute;right:0;top:50px;width:min(340px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(20,16,30,.18);z-index:30;padding:6px 0;text-align:left}
.bpanel .it{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}.bpanel .it:first-of-type{border-top:0}
.bpanel .it:hover{background:var(--soft)}
.lv{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--info)}.lv.warn{background:var(--warn)}.lv.bad{background:var(--bad)}.lv.ok{background:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 8px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.dim{color:var(--muted);font-size:13px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 16px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--ink-2)}
.pd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tile{display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .ti{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}.tile .ti svg{width:24px;height:24px}
.tile b{font-size:16.5px;display:block}.tile .tb{position:absolute;top:10px;right:12px}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--f-display);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* forms */
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=datetime-local],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.checks{display:grid;gap:6px}.ck{display:flex;gap:8px;align-items:center;font-size:13.5px}
.ck .i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.ck.ok .i{background:var(--ok-soft);color:var(--ok)}.ck.no .i{background:var(--bad-soft);color:var(--bad)}
.plats{display:flex;gap:8px;flex-wrap:wrap}.plat{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;background:var(--panel)}
.plat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plat.off{opacity:.45;cursor:not-allowed}
/* thumbs */
.th{border-radius:10px;position:relative;overflow:hidden;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:flex-end;padding:6px 8px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.th.v{aspect-ratio:9/16}.th.h{aspect-ratio:16/9}
.th .d{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);border-radius:5px;padding:0 5px;font-size:11px;font-weight:500}
/* inbox / dm */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
.list .it{display:flex;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.list .it:hover{background:var(--soft)}.list .it.on{border-color:var(--accent);background:var(--accent-soft)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:14px}
.unread{font-weight:700}
.msgs{display:grid;gap:8px;max-height:340px;overflow:auto;padding:4px 2px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--soft);width:fit-content}
.msg.me{margin-left:auto;background:var(--accent-soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:5px 14px;font-size:13.5px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* cut */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.cc:hover{border-color:var(--accent)}.cc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cc .t{padding:7px 9px;font-size:12.5px}
.pv{position:sticky;top:16px}
.player{aspect-ratio:16/9;border-radius:10px;position:relative;overflow:hidden}
.player .pl{position:absolute;inset:auto 10px 10px 10px;height:5px;background:rgba(255,255,255,.35);border-radius:3px}.player .pl i{display:block;height:100%;width:34%;background:#fff;border-radius:3px}
/* marketing charts */
.mk-p{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.mk-p svg{display:block;width:100%;height:auto}
.hb{display:grid;grid-template-columns:minmax(110px,240px) 1fr;gap:6px 12px;align-items:center;font-size:13px}
.hb .b{height:14px;border-radius:0 4px 4px 0;background:var(--s2)}
.vb{display:flex;gap:18px;align-items:flex-end;height:170px}
.vb div{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12.5px}
.vb i{display:block;width:100%;background:var(--s1);border-radius:4px 4px 0 0}
/* job pill + toast */
.pill{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--panel);border:1.5px solid var(--accent);border-radius:999px;padding:9px 16px 9px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(20,16,30,.16);z-index:40;cursor:pointer;max-width:min(380px,90vw)}
.sp{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.sp{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.pill.done{border-color:var(--ok)}.pill.done .sp{border-color:var(--ok);background:var(--ok);animation:none}
.pill .pb{height:4px;background:var(--accent-soft);border-radius:3px;margin-top:3px;overflow:hidden}.pill .pb i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:50;max-width:90vw}
.mtoggle{display:none}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.split{grid-template-columns:minmax(0,1fr)}.pv{position:static}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;inset:0 auto 0 0;width:250px;z-index:60;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .mtoggle{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);flex:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g3,.g4{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="app">
  <nav id="nav" aria-label="เมนู">
    <div class="brand"><div class="logo">M</div><div><b>Mail</b><small>มาร์เก็ตติ้ง · โตช่อง</small></div></div>
    <div class="nsec">เมนู</div>
    <div id="menu"></div>
    <div class="navfoot">เดโม — ไม่ได้ต่อบัญชีจริง</div>
  </nav>
  <main>
    <div class="top">
      <button class="mtoggle" id="mtog" aria-label="เปิดเมนู"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div style="min-width:0"><h1 id="ttl"></h1><p id="sub"></p><span class="demo">เดโม · ข้อมูลตัวอย่าง ไม่ใช่ช่องจริง</span></div>
      <div style="margin-left:auto;position:relative">
        <button class="bell" id="bell" aria-label="การแจ้งเตือน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n" id="bn"></span></button>
        <div class="bpanel" id="bp" hidden></div>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>
<div class="pill" id="pill" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':Number(n).toLocaleString('th-TH');
const IC={home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',post:'<path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/>',
 inbox:'<path d="M4 5h16v10H9l-5 4z"/>',dm:'<path d="m3 11 18-8-8 18-2-8z"/>',cut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
 mk:'<path d="M3 11v2a2 2 0 0 0 2 2h1l5 4V5L6 9H5a2 2 0 0 0-2 2z"/><path d="M16 8a5 5 0 0 1 0 8"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const PL={yt:['YouTube','--yt'],tt:['TikTok','--tt'],fb:['Facebook','--fb'],ig:['Instagram','--ig']};
const pdot=p=>`<span class="pd" style="background:var(${PL[p][1]})" title="${PL[p][0]}"></span>`;
const GRAD=['linear-gradient(135deg,#5b2a86,#e8458b)','linear-gradient(135deg,#0f5e6b,#1fb8c0)','linear-gradient(135deg,#7a3b12,#eb6834)','linear-gradient(135deg,#123d7a,#3b78d8)','linear-gradient(135deg,#25502d,#1baf7a)','linear-gradient(135deg,#4a1730,#d9529f)'];
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

// ---------- sample data (a made-up gaming channel) ----------
const S={
 comments:[
  {id:1,p:'yt',who:'nong_pim',av:'#e8458b',clip:'ผีโผล่หน้าประตู EP.3',text:'ตกใจแทนเลย 555 ตอนต่อไปเมื่อไหร่คะ',ago:'12 นาที'},
  {id:2,p:'tt',who:'game_boy99',av:'#1fb8c0',clip:'เพื่อนบอกทางผิด EP.2',text:'เพื่อนผมก็เป็นแบบนี้ ซ้ายบอกขวา',ago:'40 นาที'},

  {id:4,p:'yt',who:'mew.mew',av:'#eb6834',clip:'ยิงไม่ทัน! EP.7',text:'ตรงวินาทีที่ 0:12 ฮามาก',ago:'2 ชม.'},
  {id:5,p:'tt',who:'tonkla_',av:'#1baf7a',clip:'ร้านนี้มีผี EP.2',text:'1 วิ่ง',ago:'3 ชม.'},
  {id:6,p:'ig',who:'ploy.p',av:'#d9529f',clip:'ถ้าลิ้นยาวขึ้นทุกวินาที',text:'😂😂😂',ago:'5 ชม.'}],
 dms:[
  {id:1,p:'tt',who:'game_boy99',av:'#1fb8c0',unread:true,msgs:[['them','พี่ครับ อยากให้เล่นเกมผีภาค 2 ครับ'],['them','จะรอดูนะครับ']]},
  {id:2,p:'ig',who:'brand.studio',av:'#6250d6',unread:true,msgs:[['them','สวัสดีค่ะ สนใจรีวิวสินค้าไหมคะ'],['them','ส่งรายละเอียดทางอีเมลได้เลยค่ะ']]},
  {id:3,p:'fb',who:'Kittipong S.',av:'#3b78d8',unread:false,msgs:[['them','ไลฟ์คืนนี้กี่โมงครับ'],['me','สองทุ่มครับ']]}],
 streams:[['2026-11-16 20-21.mp4','6.6 GB','3:12:40'],['2026-11-13 20-30.mp4','9.3 GB','4:01:05'],['2026-11-12 19-12.mp4','15.0 GB','5:44:18'],['2026-11-11 21-52.mp4','9.6 GB','3:58:02'],['2026-11-10 20-12.mp4','3.4 GB','1:27:33'],['2026-11-09 19-37.mp4','7.8 GB','3:20:51']],
 next:[['พ 19:00',['tt','fb'],'ลิ้นติดเทอร์โบ'],['พฤ 12:30',['yt'],'เพื่อนบอกทางผิด EP.3'],['พฤ 19:00',['tt','fb','yt'],'แท็กซี่ผี EP.2'],['ศ 14:00',['yt'],'ร้านนี้มีผี EP.3'],['ส 20:00',['yt'],'รวมฉากผีหลอก ภาค 2 (คลิปยาว)']]
};
let doneComments=new Set();

// ---------- menu + routing ----------
const PAGES=[['home','ภาพรวม','สรุปช่อง สิ่งที่ต้องทำ และโพสต์ถัดไป ในหน้าเดียว'],['post','ลงคลิป','ลงทีเดียว TikTok + Facebook + YouTube ตั้งเวลาได้'],
