<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail Agency — แพลตฟอร์มการตลาดครบวงจรสำหรับเอเจนซี (Interactive Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f8f9fc; --ink:#191826; --ink2:#4f4d63; --muted:#848299; --line:#e5e7f0;
  --brand:#e8458b; --brand-soft:#fde9f2; --brand-ink:#b92a69;
  --ok:#169c65; --ok-bg:#e8f8f0; --warn:#d97706; --warn-bg:#fff5e0; --bad:#dc2626; --bad-bg:#fef0f0;
  --yt:#ff4e45; --tt:#0fb5bd; --fb:#3b82f6; --ig:#d9469b; --line-oa:#06c755;
  --r:14px; --shadow:0 2px 10px rgba(20,18,40,.05);
  --fd:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --fb-font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--fb-font);min-height:100vh}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* sidebar */
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20}
.brandbar{padding:16px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font:700 18px var(--fd);display:grid;place-items:center;box-shadow:0 4px 12px rgba(232,69,139,.3)}
.brandbar h1{margin:0;font:700 17px/1.15 var(--fd)}
.brandbar small{color:var(--muted);font-size:11.5px;display:block}
.ws-box{padding:12px 14px;border-bottom:1px solid var(--line)}
.ws-box label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;display:block;margin-bottom:5px;text-transform:uppercase}
.ws-sel{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-weight:600;cursor:pointer}
.ws-sel:focus{outline:none;border-color:var(--brand)}
nav{padding:10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nsec{font-size:11px;font-weight:700;color:var(--muted);padding:10px 10px 4px;letter-spacing:.3px}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--ink2);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-weight:500;transition:.12s}
.nav-a:hover{background:var(--surface2);color:var(--ink)}
.nav-a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.nav-a svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--brand);color:#fff}
.badge.warn{background:var(--warn)} .badge.bad{background:var(--bad)} .badge.ok{background:var(--ok)}
.hybrid-box{margin:10px;padding:10px 12px;border-radius:12px;background:#f3fbf7;border:1px solid #bce8d1;font-size:12px}
.hybrid-box .hd{display:flex;align-items:center;gap:6px;font-weight:700;color:#116b45}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,156,101,.2)}
.hybrid-box p{margin:3px 0 0;color:#2c6e52;font-size:11.5px;line-height:1.4}
/* top header */
main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:15}
.topbar h2{margin:0;font:700 20px/1.2 var(--fd)}
.topbar .sub{color:var(--muted);font-size:12.5px}
.sp{flex:1}
.demo-tag{font-size:12px;font-weight:600;background:var(--warn-bg);color:var(--warn);border:1px solid #f6d598;padding:4px 10px;border-radius:999px}
.mob-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer}
.content{padding:20px 24px 56px;max-width:1280px;width:100%;margin:0 auto}
/* common UI */
.btn{border:0;background:var(--brand);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;transition:.12s}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.line{background:var(--line-oa)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 4px;font:600 16px/1.3 var(--fd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dim{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.kpi .v{font:700 28px/1.2 var(--fd);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:4px;color:var(--ok);font-weight:600}
.kpi .d.warn{color:var(--warn)} .kpi .d.bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:block}
.p-yt{background:#ffeceb;color:#b8251e} .p-yt i{background:var(--yt)}
.p-tt{background:#e1f8f9;color:#0a747a} .p-tt i{background:var(--tt)}
.p-fb{background:#e8f1ff;color:#1d55b8} .p-fb i{background:var(--fb)}
.p-ig{background:#fce8f5;color:#a02475} .p-ig i{background:var(--ig)}
.p-line{background:#e6f9ee;color:#057a35} .p-line i{background:var(--line-oa)}
.st-wait{background:var(--warn-bg);color:#9a5200}
.st-ok{background:var(--ok-bg);color:#0e6f46}
.st-rev{background:var(--bad-bg);color:#b91c1c}
.st-pub{background:#eef0ff;color:#3730a3}
.crisis{background:linear-gradient(90deg,#fff1f2,#fff7f7);border:1.5px solid #fecaca;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.crisis .ic{width:38px;height:38px;border-radius:10px;background:#fee2e2;color:var(--bad);display:grid;place-items:center;flex:none;font-weight:800;font-size:18px}
/* calendar */
.cal-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-hd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:112px;padding:7px;display:flex;flex-direction:column;gap:5px}
.cal-cell.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cal-cell.off{background:var(--surface2);opacity:.55}
.cal-d{font-size:12px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between}
.cal-ev{font-size:11.5px;padding:4px 6px;border-radius:7px;border-left:3px solid var(--brand);background:var(--surface2);cursor:pointer;line-height:1.3;transition:.1s}
.cal-ev:hover{filter:brightness(.97);transform:translateY(-1px)}
.cal-ev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev span{font-size:10.5px;color:var(--muted)}
/* approval portal */
.mode-bar{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line);width:fit-content;margin-bottom:14px}
.mode-bar button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink2);font-size:13px}
.mode-bar button.on{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.client-banner{background:linear-gradient(135deg,#1d1b31,#31264b);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.client-banner h3{margin:0;color:#fff;font-size:18px}
.client-banner p{margin:4px 0 0;color:#d2cfe4;font-size:13px}
.ap-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.thumb916{aspect-ratio:9/16;border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;font-weight:700}
.thumb916 .play{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;margin:auto}
.thumb916 .hk{font-size:11px;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:7px;backdrop-filter:blur(4px)}
.rev-log{background:var(--surface2);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:12.5px}
.rev-log div+div{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
/* white-label report */
.wl-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.wl-paper{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:0 10px 30px rgba(20,18,40,.08)}
.wl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:16px;border-bottom:3px solid var(--wl-accent,#e8458b);margin-bottom:18px;flex-wrap:wrap}
.wl-logo{display:flex;align-items:center;gap:10px}
.wl-mark{width:42px;height:42px;border-radius:11px;background:var(--wl-accent,#e8458b);color:#fff;font:700 20px var(--fd);display:grid;place-items:center}
.wl-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.wl-k{background:#f8f9fc;border:1px solid #e7e9f2;border-radius:11px;padding:12px}
.wl-k .l{font-size:11.5px;color:#6e6c82} .wl-k .v{font:700 22px var(--fd);margin-top:2px}
.wl-tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.wl-tb th,.wl-tb td{padding:8px 8px;border-top:1px solid #eceef4;text-align:left}
.wl-tb th{color:#6e6c82;border-top:0;font-weight:600}
/* highlight hybrid */
.hl-seg{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.hl-seg.sel{border-color:var(--brand);background:#fff7fb}
.hl-score{width:46px;height:46px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);font:700 16px var(--fd);display:grid;place-items:center;flex:none}
/* inbox */
.inb-r{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start;flex-wrap:wrap}
.inb-r.crisis-row{border-color:#fca5a5;background:#fff5f5}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,14,28,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:16px;padding:20px 22px;max-width:520px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.22)}
.toast{position:fixed;right:20px;bottom:20px;background:#191826;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;display:none;max-width:380px}
.toast.show{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* responsive */
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-270px;top:0;bottom:0;width:252px;transition:.2s;box-shadow:10px 0 30px rgba(0,0,0,.18)}
  aside.open{left:0}
  .mob-btn{display:inline-flex}
  .wl-wrap,.ap-card{grid-template-columns:1fr}
  .wl-kpis{grid-template-columns:repeat(2,1fr)}
  .cal-grid{grid-template-columns:repeat(2,1fr)}
  .cal-hd{display:none}
}
/* print for real PDF White-Label export */
@media print{
  aside,.topbar,.no-print,#toast,.modal-bg{display:none!important}
  .app,.content,.wl-wrap{display:block!important;padding:0!important;max-width:100%!important}
  .wl-paper{border:0!important;box-shadow:none!important;padding:0!important}
  body{background:#fff!important}
}
</style>
</head>
<body>
<div class="app">
  <aside id="aside">
    <div class="brandbar">
      <div class="logo">M</div>
      <div><h1>Mail Agency</h1><small>ระบบจัดการหลายแบรนด์</small></div>
    </div>
    <div class="ws-box">
      <label>แบรนด์ลูกค้า (Workspace)</label>

    <div class="hybrid-box">

    </div>
  </aside>

  <main>
    <header class="topbar">
      <button class="mob-btn" id="mobBtn" type="button">เมนู</button>
      <div><h2 id="pageTitle">ภาพรวมเอเจนซี</h2><div class="sub" id="pageSub"></div></div>
      <span class="sp"></span>
      <span class="demo-tag">โหมดเดโมขายงาน · ข้อมูลตัวอย่างสมมติ</span>
      <button class="btn sm line" type="button" onclick="sendLineSummary()">ส่งสรุปเข้า LINE กลุ่ม</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3500);
}

    BRANDS.map(b=>`<option value="${b.id}" ${WS===b.id?'selected':''}>● ${E(b.name)} (${E(b.tag)})</option>`).join('');
  sel.onchange=()=>{WS=sel.value; if(WS!=='all')WL.brand=WS; render()};
  document.getElementById('nav').innerHTML=NAV_ITEMS.map(it=>{
    if(it.sec)return `<div class="nsec">${it.sec}</div>`;
    const cnt=it.badge?it.badge():0;
    const bc=typeof it.bcls==='function'?it.bcls():(it.bcls||'');
    return `<button class="nav-a ${TAB===it.id?'on':''}" onclick="go('${it.id}')">${ICONS[it.ic]}<span>${it.label}</span>${cnt?`<span class="badge ${bc}">${cnt}</span>`:''}</button>`;
  }).join('');
}

    </div>`;
  }
  return `<div class="card">
    <div class="cal-bar">
      <b>พฤศจิกายน 2026 (มุมมอง 2 สัปดาห์รวมข้ามลูกค้า)</b><span class="sp"></span>
      ${['all','tiktok','instagram','facebook','youtube'].map(p=>`<button class="btn sm ${CAL_PLAT===p?'':'ghost'}" onclick="CAL_PLAT='${p}';render()">${p==='all'?'ทุกแพลตฟอร์ม':PLATS[p].name}</button>`).join('')}

    p=Math.min(100,p+20);
    const b=document.getElementById('hlBar'), tx=document.getElementById('hlPct');
    if(b)b.style.width=p+'%'; if(tx)tx.textContent=p+'%';
    if(p>=100){
      clearInterval(iv); RENDERING=false;
      const h=sel[0];
      DRAFTS.unshift({id:'d'+(DRAFTS.length+1), brand:h.brand, title:`[ตัดจากไลฟ์] ${h.tag} (${h.dur})`, plat:'tiktok', day:27, time:'20:00', dur:h.dur, hook:'67%',
        caption:h.quote.replace(/^"|"$/g,'')+' #โปรไลฟ์สด', grad:'linear-gradient(155deg,#e8458b,#f97316)', status:'wait',
        notes:[{by:'Local GPU Node', at:'เมื่อสักครู่', text:'เรนเดอร์ 1080×1920 + ซับไทยเสร็จแล้ว ส่งเข้าคิวรอลูกค้าอนุมัติอัตโนมัติ'}]});
      showToast('เรนเดอร์เสร็จ 100%! ส่งคลิปเข้าหน้า พอร์ทัลอนุมัติงาน แล้ว');
      go('approval');
    }
  },320);
}

function viewCompare(){
  const b = brandOf(WS==='all'?'glow':WS);
  const mx = Math.max(...COMP_DATA.map(c=>c.med));
  return `<div class="card"><h3>เทียบคู่แข่งในกลุ่มสินค้าเดียวกัน (วิวกลาง / คลิป)</h3>
    <div class="dim" style="margin-bottom:12px">ดึงสถิติสาธารณะ YouTube / IG Business Discovery เปรียบเทียบกับแบรนด์ลูกค้า (ข้อมูลตัวอย่าง)</div>
    ${COMP_DATA.map(c=>`<div style="display:grid;grid-template-columns:minmax(150px,230px) 1fr 160px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px">
      <b style="color:${c.mine?'var(--brand-ink)':'var(--ink)'}">${E(c.name)}</b>
      <div style="height:14px;background:var(--surface2);border-radius:99px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(100*c.med/mx)}%;background:${c.mine?'var(--brand)':'#64748b'};border-radius:99px"></i></div>
      <div class="dim" style="text-align:right"><b>${fmt(c.med)}</b> วิว · ${c.freq}/สัปดาห์</div>
    </div>`).join('')}
  </div>
  <div class="card"><h3>AI แนะนำแนวทางคอนเทนต์สำหรับ ${E(b.name)}</h3>
    <ul style="margin:8px 0 0 18px;padding:0;line-height:1.8">${b.aiNext.map(x=>`<li>${E(x)}</li>`).join('')}</ul>
  </div>`;
}

  calendar:['ปฏิทินรวมข้ามลูกค้า','วางแผนและเลื่อนคิวลงคลิปของลูกค้าทุกแบรนด์พร้อมกัน'],
  approval:['พอร์ทัลลูกค้ากดอนุมัติงาน','สลับดูมุมมองเอเจนซี / ลูกค้า กดอนุมัติและส่งคอมเมนต์แก้ไขได้จริง'],
  report:['รายงาน White-Label โลโก้เอเจนซี','ปรับชื่อ สี โลโก้ แล้วกดพิมพ์เป็น PDF ส่งลูกค้าได้ทันที'],
  inbox:['กล่องคอมเมนต์หลายแบรนด์ + แจ้งเตือนดราม่า','ตอบคอมเมนต์ทุกแบรนด์พร้อม AI ร่างคำตอบตามโทนแบรนด์'],
  hybrid:['ตัดไฮไลต์ไลฟ์ขายของ (ไฮบริด)','จับช่วงบอกราคา/โปร/CF อัตโนมัติ และเรนเดอร์บนคอมออฟฟิศ'],
  compare:['เทียบคู่แข่ง & AI แนะนำแนวทาง','เห็นจุดแข็งของแบรนด์ลูกค้าเทียบคู่แข่งในกลุ่มเดียวกัน']

function render(){

render();
