<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI","Tahoma",sans-serif;
 background:radial-gradient(circle at 20% 15%,#3b1f43 0%,#1a1826 55%,#12111b 100%);color:#1f1d2b}
html.autounlock body{background:#f6f7fb}
html.autounlock.autodark body{background:#0f111a}
html.autounlock #box{display:none!important}
.card{width:min(410px,100%);background:#fff;border-radius:22px;padding:30px 28px;box-shadow:0 24px 64px rgba(0,0,0,.42);text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:#FF6FAE;color:#111;font-weight:900;font-size:28px;display:grid;place-items:center;
 margin:0 auto 14px;box-shadow:0 8px 22px rgba(255,111,174,.38)}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
.sub{margin:6px 0 20px;font-size:13.5px;color:#6e6c7e;line-height:1.5}
.inp-w{position:relative;margin-bottom:12px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:15px;padding:12px 62px 12px 14px;border:1.5px solid #d9dce6;border-radius:12px;outline:none;transition:border-color .15s}
input:focus{border-color:#e8458b}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#6e6c7e;font:600 12px inherit;cursor:pointer;padding:4px 6px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:#5f5d70;margin:4px 0 16px;cursor:pointer;justify-content:flex-start}
button.go{width:100%;background:#e8458b;color:#fff;border:0;border-radius:12px;padding:12px 16px;font:700 15px inherit;cursor:pointer;transition:background .15s}
button.go:hover{background:#c9306f} button.go:disabled{opacity:.6;cursor:wait}
.err{margin-top:12px;font-size:13px;color:#c0313a;min-height:18px}
.foot{margin-top:16px;font-size:11.5px;color:#9a98a8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .28s ease}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw, saltB64, iters){
 const enc=new TextEncoder();
 const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(saltB64),iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function decWithKey(obj, key){
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(obj.v)},key,b64(obj.c));
 return new TextDecoder().decode(plain);
}
async function loadFixtures(key){
 if(!NEED_FIX) return {};
 try{const cached=sessionStorage.getItem('mail_web_fix');if(cached)return JSON.parse(cached)}catch(e){}
 const resp=await fetch('./data.enc?v=20261120020225');
 if(!resp.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
 const encObj=await resp.json();
 const txt=await decWithKey(encObj, key);
 try{if(txt.length < 2200000) sessionStorage.setItem('mail_web_fix', txt)}catch(e){}
 return JSON.parse(txt);
}
async function unlockWithKey(key, pw, save){
 const err=document.getElementById('err'),go=document.getElementById('go'),box=document.getElementById('box');
 let html='';
 try{
  html=await decWithKey(P, key);
 }catch(e){
  document.documentElement.classList.remove('autounlock');
  go.disabled=false;go.textContent='เข้าสู่ระบบ';
  box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
  err.textContent='รหัสผ่านไม่ถูกต้อง — ลองใหม่อีกครั้ง';
  return false;
 }
 try{
  const fix=await loadFixtures(key);
  window.__MAIL_FIX = fix;
  try{
   const jwk=await crypto.subtle.exportKey('jwk', key);
   sessionStorage.setItem('mail_web_jwk', JSON.stringify(jwk));
   if(pw){sessionStorage.setItem('mail_demo_pw',pw);if(save)localStorage.setItem('mail_demo_pw',pw)}
  }catch(e){}
  document.documentElement.classList.remove('autounlock','autodark');document.open();document.write(html);document.close();
  return true;
 }catch(e){
  document.documentElement.classList.remove('autounlock');
  go.disabled=false;go.textContent='เข้าสู่ระบบ';
  err.textContent='รหัสผ่านถูกต้อง แต่โหลดข้อมูลไม่สำเร็จ — กด Ctrl+F5 ลองใหม่';
  return false;
 }
}
async function unlock(pw, save){
 pw = String(pw || '').trim();
 const err=document.getElementById('err'),go=document.getElementById('go');
 if(!window.crypto||!crypto.subtle){document.documentElement.classList.remove('autounlock');err.textContent='ต้องเปิดผ่าน HTTPS (github.io / netlify.app) เพื่อถอดรหัสครับ';return false}
 err.textContent='';go.disabled=true;go.textContent='กำลังตรวจสอบรหัส…';
 const key=await deriveKey(pw, P.s, P.i);
 return unlockWithKey(key, pw, save);
}

document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
const runAuto=async()=>{
 try{
  const jwkTxt=sessionStorage.getItem('mail_web_jwk');
  if(jwkTxt){
   const key=await crypto.subtle.importKey('jwk', JSON.parse(jwkTxt), {name:'AES-GCM',length:256}, true, ['decrypt']);
   if(await unlockWithKey(key, '', false)) return;
  }
 }catch(e){}
 let saved='';
 try{saved=sessionStorage.getItem('mail_demo_pw')||localStorage.getItem('mail_demo_pw')||''}catch(e){}
 if(saved){const ok=await unlock(saved,false);if(!ok){try{sessionStorage.removeItem('mail_demo_pw');localStorage.removeItem('mail_demo_pw');sessionStorage.removeItem('mail_web_fix');sessionStorage.removeItem('mail_web_jwk')}catch(e){}document.getElementById('err').textContent=''}}
 else{document.documentElement.classList.remove('autounlock','autodark')}
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(runAuto,0));else setTimeout(runAuto,0);
